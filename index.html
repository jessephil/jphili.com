<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jesse Philippi — Layout Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cormorant+SC:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --parchment: #f5eedf;
      --parchment-dark: #ede3cc;
      --parchment-deeper: #d9cdb0;
      --ink: #2a2218;
      --ink-mid: #5a4e38;
      --ink-faint: #9a8e78;
      --gold: #8a6d2f;
      --gold-light: #c9a84c;
      --gold-pale: #f0e4c0;
      --forest: #2d4a2a;
      --border: rgba(138,109,47,0.25);
      --border-strong: rgba(138,109,47,0.5);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'EB Garamond', Georgia, serif;
      background: var(--parchment);
      color: var(--ink);
      min-height: 100vh;
      font-size: 18px;
      line-height: 1.7;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.012) 2px, rgba(0,0,0,0.012) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.008) 3px, rgba(0,0,0,0.008) 6px);
      pointer-events: none;
      z-index: 0;
    }

    nav {
      position: relative;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3rem;
      height: 64px;
      background: var(--parchment);
      border-bottom: 1px solid var(--border);
    }

    .nav-ornament { display: flex; align-items: center; gap: 12px; }
    .nav-rule { width: 32px; height: 1px; background: var(--gold); opacity: 0.6; }
    .nav-name {
      font-family: 'Cormorant SC', serif;
      font-size: 15px;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .nav-links { display: flex; gap: 2.5rem; }
    .nav-links a {
      font-family: 'Cormorant SC', serif;
      font-size: 12px;
      font-weight: 300;
      color: var(--ink-mid);
      text-decoration: none;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--gold); }

    .tools {
      position: relative;
      z-index: 1;
      padding: 4rem 3rem 6rem;
      max-width: 1180px;
      margin: 0 auto;
    }

    .tools-header { text-align: center; margin-bottom: 2.5rem; }
    .tools-eyebrow {
      font-family: 'Cormorant SC', serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }
    .tools-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      color: var(--ink);
      letter-spacing: 0.02em;
    }

    /* SEARCH */
    .search-wrap {
      max-width: 460px;
      margin: 2rem auto 0;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      font-family: 'EB Garamond', serif;
      font-size: 16px;
      font-style: italic;
      color: var(--ink);
      background: var(--parchment-dark);
      border: 1px solid var(--border);
      padding: 0.7rem 1rem 0.7rem 2.4rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-wrap input:focus { border-color: var(--border-strong); background: var(--gold-pale); }
    .search-wrap input::placeholder { color: var(--ink-faint); }
    .search-wrap svg {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      width: 15px; height: 15px;
      stroke: var(--ink-faint);
      fill: none;
      stroke-width: 1.5;
    }

    /* CATEGORY JUMP NAV */
    .cat-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 1.75rem auto 0;
      max-width: 900px;
    }
    .cat-pill {
      font-family: 'Cormorant SC', serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-mid);
      background: transparent;
      border: 1px solid var(--border);
      padding: 6px 14px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }
    .cat-pill:hover, .cat-pill.active {
      border-color: var(--border-strong);
      background: var(--gold-pale);
      color: var(--ink);
    }
    .cat-pill .count { color: var(--ink-faint); font-style: italic; margin-left: 3px; }

    /* CATEGORY GROUPS */
    .cat-group { margin-top: 3.5rem; }
    .cat-group:first-of-type { margin-top: 3rem; }
    .cat-heading {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 1.4rem;
      scroll-margin-top: 84px;
    }
    .cat-heading h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
    }
    .cat-heading .rule {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .cat-heading .cat-tally {
      font-family: 'Cormorant SC', serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      font-style: italic;
      white-space: nowrap;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 20px;
    }

    .tool-card {
      background: var(--parchment-dark);
      border: 1px solid var(--border);
      padding: 1.6rem 1.5rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      transition: border-color 0.25s, background 0.25s, transform 0.2s;
    }
    .tool-card::before, .tool-card::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      border-color: var(--gold-light);
      border-style: solid;
      opacity: 0.7;
      transition: opacity 0.25s;
    }
    .tool-card::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .tool-card::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
    .tool-card:hover { border-color: var(--border-strong); background: var(--gold-pale); transform: translateY(-3px); }
    .tool-card:hover::before, .tool-card:hover::after { opacity: 1; }

    .tool-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.25;
      letter-spacing: 0.01em;
    }
    .tool-desc { font-size: 14px; color: var(--ink-mid); line-height: 1.6; flex: 1; }

    .no-results {
      display: none;
      text-align: center;
      padding: 3rem 0;
      color: var(--ink-faint);
      font-style: italic;
      font-size: 16px;
    }

    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      background: var(--parchment-deeper);
      padding: 2.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-name { font-family: 'Cormorant SC', serif; font-size: 13px; letter-spacing: 0.15em; color: var(--ink-mid); }
    .footer-year { font-size: 13px; color: var(--ink-faint); font-style: italic; }

    @media (max-width: 600px) {
      nav { padding: 0 1.25rem; }
      .nav-links { gap: 1.5rem; }
      .tools { padding: 3rem 1.25rem 4rem; }
      footer { padding: 2rem 1.5rem; flex-direction: column; gap: 6px; text-align: center; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-ornament">
      <div class="nav-rule"></div>
      <a class="nav-name" href="#">Jesse Philippi</a>
      <div class="nav-rule" style="background: linear-gradient(90deg, var(--gold), transparent);"></div>
    </div>
    <div class="nav-links">
      <a href="#tools">Works</a>
      <a href="mailto:contact@jphili.com">Contact</a>
    </div>
  </nav>

  <section class="tools" id="tools">
    <div class="tools-header">
      <h2 class="tools-title">Engineering Tools</h2>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Search calculators…" autocomplete="off">
    </div>

    <div class="cat-nav" id="cat-nav"></div>

    <div id="groups-container"></div>

    <p class="no-results" id="no-results">No calculators match that search.</p>
  </section>

  <footer>
    <span class="footer-name">Jesse Philippi</span>
    <span class="footer-year">&copy; 2026</span>
  </footer>

  <script>
    const arrow = '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

    const tools = [
      {cat:"Mechanical Design", title:"Bearing L10 Life", desc:"ISO 281 bearing life calculations — compute expected L10 life from a known dynamic load rating, or find the required rating for a target service life.", href:"bearing_L10_life.html", label:"Open calculator"},
      {cat:"Mechanical Design", title:"Shaft Stress — Torsion", desc:"Torsional shear stress for solid and hollow shafts — computes applied stress from torque, max allowable torque, and keyway stress concentration effects.", href:"shaft_stress.html", label:"Open calculator"},
      {cat:"Mechanical Design", title:"Torque Calculator", desc:"Convert between power, speed, and torque — power + speed to torque, or torque + speed to power, across hp, kW, in·lb, ft·lb, and N·m.", href:"torque_calculator.html", label:"Open calculator"},
      {cat:"Mechanical Design", title:"Fastener Preload", desc:"VDI 2230 torque-preload for standard bolts and SHCS — accounts for both thread and bearing face friction, with torque specs by grade at 75/85/90% proof load.", href:"fastener_preload.html", label:"Open calculator"},
      {cat:"Mechanical Design", title:"Power Screw Calculator", desc:"Axial force, efficiency, and self-locking analysis for ACME, square, and large-thread power screws — jacks, clamps, presses, and lead screws.", href:"power_screw_calculator.html", label:"Open calculator"},
      {cat:"Mechanical Design", title:"Gear Design Calculator", desc:"Get gear geometry and stress given tooth size, mating gear and input torque.", href:"Gear_Design_Calculator.html", label:"Open calculator"},
      {cat:"Mechanical Design", title:"Beam Bending Calculator", desc:"Find shear forces, bending moments, deflection, and reactionary forces at supports along a beam.", href:"beam-bending-calculator.html", label:"Open calculator"},
      {cat:"Mechanical Design", title:"Moment of Inertia Calculator", desc:"Find the moment of inertia of an object given the size and shape.", href:"moment-of-inertia-calculator.html", label:"Open calculator"},

      {cat:"Heat Transfer", title:"Conduction — Flat Plate", desc:"Fourier's Law for steady-state conduction — computes heat transfer rate, thermal resistance, and heat flux across 28 common engineering materials.", href:"conduction_flat_plate.html", label:"Open calculator"},
      {cat:"Heat Transfer", title:"Conduction — Cylinder", desc:"Radial conduction through a hollow cylinder — computes heat transfer rate, thermal resistance, and inner wall heat flux across 28 engineering materials.", href:"heat_transfer_cylinder.html", label:"Open calculator"},
      {cat:"Heat Transfer", title:"Convection Coefficient", desc:"Calculate the coefficient of convective heat transfer of water or oil flowing through a pipe.", href:"convective_heat_transfer.html", label:"Open calculator"},

      {cat:"Thermal Engineering", title:"Heat-Up Calculator", desc:"Find required power to heat a mass in a target time, or find required time given available power — for water, Therminol 66, ISO 220, steel, and aluminum.", href:"heat_up_calculator.html", label:"Open calculator"},
      {cat:"Thermal Engineering", title:"Fluid Power Calculator", desc:"Calculate thermal power from flow rate and temperature change for water, ISO 220, ISO 320, and Therminol 66 — results in kW, hp, and BTU/hr.", href:"fluid_power_calculator.html", label:"Open calculator"},

      {cat:"Fluid Mechanics", title:"Pipe Flow Calculator", desc:"Full-range pipe flow — Hagen-Poiseuille for laminar and Darcy-Weisbach with Colebrook-White for turbulent, both shown simultaneously with a live Moody diagram.", href:"pipe_flow_calculator.html", label:"Open calculator"},
      {cat:"Fluid Mechanics", title:"Hydraulic Diameter Calculator", desc:"Get equivalent diameter for a number of shapes.", href:"hydraulic-diameter-calc.html", label:"Open calculator"},

      {cat:"Hydraulics", title:"Accumulator Sizing", desc:"Find needed minimum accumulator size given pressures and the size of the cylinder being used.", href:"Accumulator_Sizing.html", label:"Open calculator"},

      {cat:"Pressure Vessel Design", title:"Hoop Stress", desc:"Lamé equations for stress distribution through a thick-walled cylinder — tangential, radial, longitudinal, and Von Mises stress with safety factor.", href:"hoop_stress.html", label:"Open calculator"},

      {cat:"Structural Engineering", title:"Thermal Expansion Calculator", desc:"Compute thermal elongation, strain, and induced stress for constrained members across eight common engineering materials.", href:"thermal_expansion_calculator.html", label:"Open calculator"},

      {cat:"Vehicle Engineering", title:"Acceleration Calculator", desc:"Compute wheel force and acceleration in each gear from engine torque, gear ratios, differential ratio, tire size, and vehicle weight.", href:"acceleration_calculator.html", label:"Open calculator"},

      {cat:"Energy Reference", title:"Energy Conversions", desc:"A comparative reference of energy quantities — from a kg of battery to world energy use — expressed in kWh, MJ, or BTU.", href:"energy_conversions.html", label:"Open reference"},
    ];

    const order = ["Mechanical Design","Heat Transfer","Thermal Engineering","Fluid Mechanics","Hydraulics","Pressure Vessel Design","Structural Engineering","Vehicle Engineering","Energy Reference"];

    function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

    const catNav = document.getElementById('cat-nav');
    const groupsContainer = document.getElementById('groups-container');

    let pill = document.createElement('a');
    pill.href = '#tools';
    pill.className = 'cat-pill active';
    pill.textContent = 'All';
    let allCount = document.createElement('span');
    allCount.className = 'count';
    allCount.textContent = '(' + tools.length + ')';
    pill.appendChild(allCount);
    catNav.appendChild(pill);

    order.forEach(cat => {
      const count = tools.filter(t => t.cat === cat).length;
      const a = document.createElement('a');
      a.href = '#cat-' + slug(cat);
      a.className = 'cat-pill';
      a.textContent = cat + ' ';
      const c = document.createElement('span');
      c.className = 'count';
      c.textContent = '(' + count + ')';
      a.appendChild(c);
      catNav.appendChild(a);
    });

    order.forEach(cat => {
      const items = tools.filter(t => t.cat === cat);
      const group = document.createElement('div');
      group.className = 'cat-group';
      group.dataset.cat = cat;

      const heading = document.createElement('div');
      heading.className = 'cat-heading';
      heading.id = 'cat-' + slug(cat);
      heading.innerHTML = '<h3>' + cat + '</h3><div class="rule"></div><span class="cat-tally">' + items.length + ' tool' + (items.length === 1 ? '' : 's') + '</span>';
      group.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = 'tools-grid';

      items.forEach(t => {
        const card = document.createElement('a');
        card.className = 'tool-card';
        card.href = t.href;
        card.dataset.search = (t.title + ' ' + t.desc + ' ' + t.cat).toLowerCase();
        card.innerHTML =
          '<p class="tool-title">' + t.title + '</p>' +
          '<p class="tool-desc">' + t.desc + '</p>';
        grid.appendChild(card);
      });

      group.appendChild(grid);
      groupsContainer.appendChild(group);
    });

    const searchInput = document.getElementById('search');
    const noResults = document.getElementById('no-results');

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      let anyVisible = false;
      document.querySelectorAll('.cat-group').forEach(group => {
        let groupHasVisible = false;
        group.querySelectorAll('.tool-card').forEach(card => {
          const match = !q || card.dataset.search.includes(q);
          card.style.display = match ? '' : 'none';
          if (match) groupHasVisible = true;
        });
        group.style.display = groupHasVisible ? '' : 'none';
        if (groupHasVisible) anyVisible = true;
      });
      noResults.style.display = anyVisible ? 'none' : 'block';
    });
  </script>

</body>
</html>
